name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Builds without deploying, so a change to this file or to the build is
  # exercised before it reaches master rather than by the production deploy.
  pull_request:
    branches: [master]
  # On master this redeploys; on any other ref it only builds.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keyed by ref so a pull-request build cannot cancel a production deploy.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  # Split from the build so only this job holds the Pages token and the
  # github-pages environment; pull requests never reach it.
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
