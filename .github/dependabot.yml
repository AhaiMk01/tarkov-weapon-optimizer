version: 2
updates:
  # The workflow actions drifted three majors behind before a runner
  # deprecation notice surfaced it. This turns each bump into a small PR, which
  # deploy.yml's pull-request build then exercises before it merges.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  # One grouped PR a month for minor and patch bumps; each major gets its own PR.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      # react-i18next names an exact i18next major as its peer, so they only install together.
      i18next:
        patterns: ["i18next*", "react-i18next"]
      # @eslint/js carries the recommended rule set of the same eslint major.
      eslint:
        patterns: ["eslint", "@eslint/js"]
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint 8.73 supports typescript below 6.1. Remove this when it supports 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
